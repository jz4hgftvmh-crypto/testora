<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Idea Analysis | Virtual Innovation Lab</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navigation -->
    <nav class="navbar">

        <div class="brand">
            <img src="image.png" alt="Virtual Innovation Lab Logo">
            <span>Virtual Innovation Lab</span>
        </div>

        <a href="index.html">Home</a>

    </nav>


    <!-- Analysis Page -->
    <main class="analysis-page">

        <section class="analysis-header">

            <p class="small-title">IDEA ANALYSIS</p>

            <h1>Let's understand your idea.</h1>

            <p>
                Answer a few questions and our AI will analyze
                your idea and give you useful recommendations.
            </p>

        </section>


        <!-- Question Card -->
        <section class="question-card">

            <p class="question-number">Question 1 of 14</p>

            <h2>What type of idea are you working on?</h2>


            <div class="options">

                <button class="option">
                    Business
                </button>

                <button class="option">
                    Scientific
                </button>

                <button class="option">
                    Engineering
                </button>

                <button class="option">
                    Technology
                </button>

            </div>


            <button class="next-button">
                Next
            </button>

        </section>

    </main>
    <script src="./analysis.js"></script>
</body>

</html>
